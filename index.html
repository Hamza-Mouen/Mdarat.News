<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>نبض ليبيا والعالم</title>
<script>
  // تطبيق الوضع المحفوظ قبل رسم الصفحة
  try { if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  function applyAccent(c) {
    var r = document.documentElement.style;
    if (!c) { r.removeProperty('--primary-color'); r.removeProperty('--primary-light'); return; }
    var n = parseInt(c.slice(1), 16);
    r.setProperty('--primary-color', c);
    r.setProperty('--primary-light', 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',.14)');
  }
  try { applyAccent(JSON.parse(localStorage.getItem('accent_v1'))); } catch (e) {}
</script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg-color:#f8f9fa;--card-bg:#fff;--glass-bg:rgba(255,255,255,.9);--text-main:#111827;--text-muted:#6b7280;--primary-color:#1877f2;--primary-light:#e7f3ff;--border-color:#e5e7eb;--shadow:0 4px 12px rgba(0,0,0,.04);--fast-transition:.15s ease;--ptr-bg:#fff}
[data-theme="dark"]{--bg-color:#121212;--card-bg:#1e1e1e;--glass-bg:rgba(30,30,30,.9);--text-main:#f3f4f6;--text-muted:#9ca3af;--primary-color:#2d88ff;--primary-light:rgba(45,136,255,.15);--border-color:#2d2d2d;--shadow:0 4px 12px rgba(0,0,0,.3);--ptr-bg:#1e293b}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif;-webkit-tap-highlight-color:transparent}
body{background-color:var(--bg-color);color:var(--text-main);padding-top:65px;padding-bottom:75px;transition:background-color .2s,color .2s;overscroll-behavior-y:contain}

/* مؤشر السحب للتحديث */
.ptr-container{position:fixed;top:-65px;left:0;width:100%;height:40px;display:flex;align-items:center;justify-content:center;gap:10px;background-color:var(--ptr-bg);color:#0ea5e9;font-weight:bold;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:9999;transition:top .3s ease;border-bottom-left-radius:16px;border-bottom-right-radius:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.ptr-loading .ptr-spinner svg{animation:spin .8s linear infinite}

header{position:fixed;top:0;left:0;right:0;height:55px;background:var(--glass-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:1000}
.app-title{font-size:1.15rem;font-weight:800;color:var(--primary-color)}
.header-btns{display:flex;gap:6px}
.fb-btn{background:var(--primary-light);border:none;color:var(--primary-color);padding:6px 12px;border-radius:16px;font-size:.8rem;font-weight:700;cursor:pointer;transition:transform var(--fast-transition),opacity var(--fast-transition);display:inline-flex;align-items:center;gap:4px}
.fb-btn:active{transform:scale(.92);opacity:.8}

.search-wrapper{padding:12px 16px;max-width:600px;margin:0 auto;position:relative;display:flex;align-items:center}
.search-icon{position:absolute;right:30px;color:var(--text-muted);pointer-events:none}
.search-input{width:100%;padding:10px 40px 10px 14px;border-radius:12px;border:1px solid var(--border-color);background-color:var(--card-bg);color:var(--text-main);font-size:.9rem;outline:none;box-shadow:var(--shadow)}

.news-container{padding:0 16px;display:flex;flex-direction:column;gap:14px;max-width:600px;margin:0 auto}
.msg{text-align:center;padding:30px;color:var(--text-muted)}
.news-card{background-color:var(--card-bg);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border-color);transition:transform var(--fast-transition)}
.news-card:active{transform:scale(.985)}
.img-wrapper{position:relative;width:100%;height:180px;background-color:#2c2c2e}
.news-img{width:100%;height:100%;object-fit:cover}
.floating-badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.7);color:#fff;padding:4px 10px;border-radius:12px;font-size:.7rem;font-weight:700}
.news-body{padding:14px}
.news-info-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:.75rem;color:var(--text-muted)}
.news-title{font-size:1.02rem;font-weight:800;line-height:1.4;margin-bottom:6px;color:var(--text-main)}
.news-desc{font-size:.83rem;color:var(--text-muted);line-height:1.5;margin-bottom:12px}
.card-actions{display:flex;gap:8px}
.action-read{flex:2;background-color:var(--primary-color);color:#fff;text-decoration:none;padding:9px;border-radius:10px;font-size:.85rem;font-weight:700;text-align:center;border:none;cursor:pointer}
.action-share{flex:1.2;background-color:var(--primary-light);color:var(--primary-color);border:none;padding:9px;border-radius:10px;font-size:.8rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--glass-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--border-color);display:flex;justify-content:space-around;z-index:1000}
.nav-btn{flex:1;border:none;background:transparent;color:var(--text-muted);font-size:.75rem;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:color var(--fast-transition)}
.nav-btn.active{color:var(--primary-color)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:2000}
.modal-overlay.open{display:flex}
.modal-sheet{background:var(--card-bg);width:100%;max-width:500px;border-radius:24px 24px 0 0;padding:18px;text-align:center;box-shadow:0 -10px 30px rgba(0,0,0,.2);max-height:92vh;overflow:auto}
.preview-img-box{width:100%;border-radius:12px;overflow:hidden;margin:12px 0;border:1px solid var(--border-color);min-height:120px}
.preview-img-box img{width:100%;display:block}
.modal-actions{display:flex;gap:10px;justify-content:center;margin-top:15px}
.modal-actions button{display:flex;align-items:center;justify-content:center;gap:8px;flex:1}

/* الإعدادات وإضافة المصادر (بنفس شكل الواجهة الرئيسية) */
.set-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.set-title{font-size:1.02rem;font-weight:800;margin-bottom:10px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--border-color)}
.set-row:first-of-type{border-top:none}
.set-row b{font-size:.9rem;font-weight:700}
.set-row small{display:block;color:var(--text-muted);font-size:.72rem;direction:ltr;text-align:right;word-break:break-all}
.icon-btn{background:var(--primary-light);color:var(--primary-color);border:none;border-radius:10px;padding:8px;cursor:pointer;display:inline-flex;flex-shrink:0}
.field{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--border-color);background:var(--bg-color);color:var(--text-main);font-size:.9rem;outline:none;margin-top:10px;text-align:right}
.field.ltr{direction:ltr;text-align:left}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:9px 18px;border-radius:20px;font-size:.82rem;font-weight:700;z-index:9998;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.rates{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 0;max-width:600px;margin:0 auto;scrollbar-width:none}
.rates::-webkit-scrollbar{display:none}
.rate{flex:0 0 auto;min-width:84px;background:var(--card-bg);border:1px solid var(--border-color);border-radius:12px;padding:6px 12px;box-shadow:var(--shadow);text-align:center}
.rate span{display:block;font-size:.7rem;color:var(--text-muted);font-weight:700}
.rate b{font-size:.92rem;font-weight:800;color:var(--primary-color)}
.rate i{display:block;font-style:normal;font-size:.68rem;font-weight:800}
.rate i.up{color:#16a34a}.rate i.dn{color:#dc2626}
.rate.gold b{color:#d97706}
/* نعومة التمرير */
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{-webkit-overflow-scrolling:touch}
header,.bottom-nav{will-change:transform;transform:translateZ(0)}
.news-card{content-visibility:auto;contain-intrinsic-size:auto 390px}
.news-img{transform:translateZ(0)}
.rates{-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.rate{scroll-snap-align:start}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.news-container>*{animation:fadeIn .3s ease both}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.news-container>*{animation:none}}
.sw-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--card-bg);box-shadow:0 0 0 2px var(--border-color);cursor:pointer;padding:0;transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.sw.on{box-shadow:0 0 0 3px var(--text-main);transform:scale(1.12)}
.sw.custom{background:conic-gradient(#ef4444,#eab308,#22c55e,#06b6d4,#3b82f6,#d946ef,#ef4444);position:relative;overflow:hidden;display:inline-block}
.sw.custom input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
/* حركة الشريط السفلي على طريقة iOS */
.nav-btn{position:relative;z-index:1}
.nav-btn svg{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.nav-btn:active svg{transform:scale(.8)}
.nav-btn svg.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3) translateY(-3px)}100%{transform:scale(1)}}
.nav-pill{position:absolute;top:6px;left:0;height:48px;border-radius:26px;background:var(--primary-light);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary-color) 14%,transparent),0 4px 14px color-mix(in srgb,var(--primary-color) 20%,transparent);transform:translateX(var(--x,0)) scale(var(--s,1));transition:transform .5s cubic-bezier(.34,1.45,.64,1),width .5s cubic-bezier(.34,1.45,.64,1);z-index:0;pointer-events:none}

</style>
</head>
<body>

<!-- مؤشر السحب للتحديث -->
<div id="pull-to-refresh" class="ptr-container">
  <div class="ptr-spinner">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><polyline points="21 3 21 8 16 8"></polyline></svg>

<header>

    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:#0ea5e9;flex-shrink:0;">
      <circle cx="12" cy="12" r="7"></circle><path d="M12 5a11 11 0 0 0 0 14"></path><path d="M12 5a11 11 0 0 1 0 14"></path><line x1="5" y1="12" x2="19" y2="12"></line>
      <ellipse cx="12" cy="12" rx="11" ry="4" transform="rotate(-25 12 12)" stroke-width="1.5"></ellipse>

<div class="rates" id="rates"></div>

  <input type="text" class="search-input" id="searchInput" placeholder="ابحث في الأخبار..." oninput="filterNews()">
</div>

<main class="news-container" id="newsContainer"><div class="msg">جاري التحميل...</div></main>

<nav class="bottom-nav" id="bottomNav"><span class="nav-pill" id="navPill"></span>

    <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg>

  <button class="nav-btn" onclick="changeTab('settings', this)">

    <span>الإعدادات</span>

</nav>

<!-- نافذة معاينة البطاقة -->
<div class="modal-overlay" id="shareModal" onclick="if(event.target===this)closeModal('shareModal')">
  <div class="modal-sheet">
    <h3 style="font-size:1rem;font-weight:800;">بطاقة الخبر جاهزة للمشاركة</h3>
    <div class="preview-img-box"><img id="generatedImage" src="" alt="بطاقة الخبر"></div>
    <p style="font-size:.72rem;color:var(--text-muted);margin-top:8px">إن لم يبدأ الحفظ، اضغط مطولاً على الصورة واختر حفظ.</p>
    <div class="modal-actions">

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        <span>مشاركة</span>

<!-- نافذة إضافة مصدر -->
<div class="modal-overlay" id="addModal" onclick="if(event.target===this)closeModal('addModal')">
  <div class="modal-sheet">
    <h3 style="font-size:1rem;font-weight:800;">إضافة مصدر أخبار</h3>

<div class="toast" id="toast"></div>

<script>
/* ===================== المصادر (تُحفظ في الجهاز ويمكن تعديلها من الإعدادات) ===================== */
const DEFAULT_SOURCES = [
  { id: 'd1', name: 'ليبيا الأحرار',   url: 'https://libyaalahrar.tv/feed', cat: 'libya' },
  { id: 'd2', name: 'صحيفة المرصد',    url: 'https://almarsad.co/feed',     cat: 'libya' },
  { id: 'd3', name: 'صدى الاقتصادية',  url: 'https://economic.ly/feed',     cat: 'economy' },
  { id: 'd4', name: 'الجزيرة نت',      url: 'https://www.aljazeera.net/aljazeerarss/a7893708-1756-4bda-8a7c-3fc9e421e42f/7343e061-f095-46ae-9524-77a8bdfd048b', cat: 'world' },
  { id: 'd5', name: 'الشرق الأوسط - العالم العربي', url: 'https://aawsat.com/feed/arab-world', cat: 'world', since: 2 },
  { id: 'd6', name: 'الشرق الأوسط - سياسة',        url: 'https://aawsat.com/feed/political',  cat: 'world', since: 2 },
  { id: 'd7', name: 'الشرق الأوسط - آسيا',         url: 'https://aawsat.com/feed/asia',       cat: 'world', since: 2 }
];
const DEFAULTS_VER = 2;
const CATS = { libya: 'محلي', economy: 'اقتصاد', world: 'العالم' };
const RSS2JSON = 'https://api.rss2json.com/v1/api.json?rss_url=';
const PROXIES = ['https://api.allorigins.win/raw?url=', 'https://corsproxy.io/?url=', 'https://api.codetabs.com/v1/proxy?quest='];
const CACHE_MIN = 5;
const DEFAULT_IMG = 'https://images.unsplash.com/photo-1585829365295-ab7cd400c167?auto=format&fit=crop&w=800&q=80';
const $ = id => document.getElementById(id);

function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
let sources = store('sources_v1') || DEFAULT_SOURCES.slice();
// إضافة المصادر الافتراضية الجديدة لمن حفظ قائمة قديمة (مرة واحدة فقط)
if (store('defaults_ver') !== DEFAULTS_VER) {
  DEFAULT_SOURCES.filter(d => d.since === DEFAULTS_VER && !sources.some(s => s.url === d.url)).forEach(d => sources.push(d));
  store('sources_v1', sources); store('defaults_ver', DEFAULTS_VER);
}
let currentBlob = null, currentTab = 'libya', currentArticles = [], shown = [], currentGeneratedDataUrl = '', loadToken = 0;

/* ===================== جلب الأخبار (الواجهة الخلفية) ===================== */
function normDate(s) {
  if (!s) return '';
  const t = /^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(s) ? s.replace(' ', 'T') + 'Z' : s; // rss2json يعيد توقيت UTC
  const d = new Date(t); return isNaN(d) ? '' : d.toISOString();
}
function imgFromHtml(h) { const m = (h || '').match(/<img[^>]+src=["']([^"']+)["']/i); return m ? m[1] : ''; }
function httpImg(u) { return u && /^https?:/i.test(u) ? u : ''; }

async function fetchFeed(src, fresh) {
  try {
    const r = await fetch(RSS2JSON + encodeURIComponent(src.url) + (fresh ? '&t=' + Date.now() : ''));
    const d = await r.json();
    if (d.status !== 'ok') throw new Error('rss2json');
    return d.items.map(i => ({
      title: strip(i.title), link: i.link, date: normDate(i.pubDate), src: src.name,
      desc: strip(i.description || i.content),
      img: httpImg(i.thumbnail) || httpImg(i.enclosure && i.enclosure.link) || httpImg(imgFromHtml(i.content || i.description))
    }));
  } catch (e) {
    // خطة بديلة: جلب ملف RSS مباشرة عبر وسيط وتحليله في المتصفح
    let txt = '';
    for (const p of PROXIES) {
      try {
        const r = await fetch(p + encodeURIComponent(src.url));
        if (!r.ok) continue;
        const t = await r.text();
        if (t.includes('<item') || t.includes('<entry')) { txt = t; break; }
      } catch (err) {}
    }
    const x = new DOMParser().parseFromString(txt, 'text/xml');
    const items = [...x.querySelectorAll('item')];
    if (!items.length) throw new Error('empty');
    return items.map(it => {
      const g = t => { const n = it.getElementsByTagName(t)[0]; return n ? n.textContent : ''; };
      const mc = it.getElementsByTagName('media:content')[0], en = it.getElementsByTagName('enclosure')[0];
      const html = g('content:encoded') || g('description');
      return {
        title: strip(g('title')), link: g('link').trim(), date: normDate(g('pubDate')), src: src.name, desc: strip(g('description')),
        img: httpImg(mc && mc.getAttribute('url')) || httpImg(en && en.getAttribute('url')) || httpImg(imgFromHtml(html))
      };
    });
  }
}

async function loadTab(tab, fresh) {
  const container = $('newsContainer'), token = ++loadToken;
  const list = sources.filter(s => s.cat === tab);
  $('searchInput').value = '';
  if (!list.length) { currentArticles = []; shown = []; container.innerHTML = '<div class="msg">لا توجد مصادر في هذا القسم. اضغط + لإضافة مصدر.</div>'; return; }

  const key = 'cache_' + tab, cached = store(key);
  const sig = list.map(s => s.url).join('|');
  if (!fresh && cached && cached.sig === sig && Date.now() - cached.t < CACHE_MIN * 60000) {
    currentArticles = cached.items; displayArticles(currentArticles); return;
  }
  container.innerHTML = `<div class="msg">جاري جلب أخبار ${esc(CATS[tab])}...</div>`;
  const results = await Promise.allSettled(list.map(s => fetchFeed(s, fresh)));
  if (token !== loadToken) return; // تم تغيير القسم أثناء التحميل
  let items = results.filter(r => r.status === 'fulfilled').flatMap(r => r.value);
  items = items.filter(i => i.title && i.link).sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0)).slice(0, 40);
  if (items.length) {
    store(key, { t: Date.now(), sig, items });
    currentArticles = items; displayArticles(items);
    const failed = results.filter(r => r.status === 'rejected').length;
    if (failed) toast(`تعذّر تحميل ${failed} من المصادر`);
  } else if (cached && cached.items.length) {
    currentArticles = cached.items; displayArticles(currentArticles); toast('لا يوجد اتصال، تم عرض آخر نسخة محفوظة');
  } else {
    currentArticles = []; shown = [];
    container.innerHTML = '<div class="msg">تعذّر جلب الأخبار. تحقق من الاتصال ثم اسحب للتحديث.</div>';
  }
}

}

/* ===================== بطاقة المشاركة (أزرق سماوي) ===================== */
function rr(x, a, b, w, h, r) {
  x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r);
  x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath();
}
function wrapText(x, text, px, py, maxW, lh, maxLines) {
  const words = text.split(' '); let line = '', lines = [];
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (x.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  if (lines.length > maxLines) { lines.length = maxLines; lines[maxLines - 1] = lines[maxLines - 1].replace(/\s*\S*$/, '') + '…'; }
  lines.forEach((l, i) => x.fillText(l, px, py + i * lh));
  return py + lines.length * lh;
}
function loadImg(url) {
  return new Promise(res => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    const t = setTimeout(() => res(null), 5000);
    im.onload = () => { clearTimeout(t); res(im); }; im.onerror = () => { clearTimeout(t); res(null); };
    im.src = url;
  });
}

const isIOS = () => /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
async function getCardBlob() {
  if (currentBlob) return currentBlob;
  currentBlob = await new Promise(r => $('newsCanvas').toBlob(r, 'image/png'));
  return currentBlob;
}
async function shareGeneratedImage() {
  try {
    const blob = await getCardBlob();
    const file = new File([blob], 'news-card.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: 'مدارات العالم' });
    else await downloadGeneratedImage();
  } catch (e) { if (!e || e.name !== 'AbortError') toast('تعذّرت المشاركة'); }
}
async function downloadGeneratedImage() {
  try {
    const blob = await getCardBlob();
    if (!blob) throw new Error('no blob');
    const file = new File([blob], 'news-card.png', { type: 'image/png' });
    // آيفون: الحفظ يتم من قائمة المشاركة (خيار "حفظ الصورة")
    if (isIOS() && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'news-card.png'; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('تم حفظ الصورة');
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    toast('اضغط مطولاً على الصورة لحفظها');
  }
}

const COINS = [['bitcoin', 'بيتكوين'], ['ethereum', 'إيثيريوم'], ['binancecoin', 'BNB'], ['solana', 'سولانا']];
const fmtUsd = (n, d) => '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: d });

function drawRates(m) {
  if (!m) { $('rates').innerHTML = ''; return; }
  let h = '';
  if (m.metals) h += [['XAU', 'ذهب (أونصة)'], ['XAG', 'فضة (أونصة)']].filter(([k]) => m.metals[k]).map(([k, n]) => `<div class="rate gold"><span>${n}</span><b>${fmtUsd(m.metals[k], 2)}</b></div>`).join('');
  if (m.crypto) h += COINS.filter(([id]) => m.crypto[id] && m.crypto[id].usd).map(([id, n]) => {
    const c = m.crypto[id], ch = c.usd_24h_change || 0;
    return `<div class="rate"><span>${n}</span><b>${fmtUsd(c.usd, c.usd < 10 ? 3 : c.usd < 1000 ? 2 : 0)}</b><i class="${ch >= 0 ? 'up' : 'dn'}">${ch >= 0 ? '▲' : '▼'} ${Math.abs(ch).toFixed(1)}%</i></div>`;
  }).join('');
  $('rates').innerHTML = h;
}

async function getMetals() {
  try { // المصدر الأول
    const [a, b] = await Promise.all(['XAU', 'XAG'].map(async k => (await (await fetch('https://api.gold-api.com/price/' + k)).json()).price));
    if (a && b) return { XAU: a, XAG: b };
  } catch (e) {}
  try { // مصدر احتياطي
    const o = {};
    for (const k of ['xau', 'xag']) { const d = await (await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/' + k + '.json')).json(); o[k.toUpperCase()] = d[k].usd; }
    return o;
  } catch (e) { return null; }
}

async function loadRates(force) {
  let c = store('mkt_v1');
  if (!force && c && Date.now() - c.t < 600000) { drawRates(c); return; } // تُحفظ 10 دقائق
  const [cr, me] = await Promise.allSettled([
    fetch('https://api.coingecko.com/api/v3/simple/price?ids=' + COINS.map(x => x[0]).join(',') + '&vs_currencies=usd&include_24hr_change=true').then(r => r.json()),
    getMetals()
  ]);
  const old = c || {}; // أي جزء فشل يبقى بآخر قيمة محفوظة
  c = { t: Date.now(), crypto: (cr.value && cr.value.bitcoin) ? cr.value : old.crypto, metals: me.value || old.metals };
  store('mkt_v1', c); drawRates(c);
}

  const name = $('srcName').value.trim(), url = $('srcUrl').value.trim(), cat = $('srcCat').value;
  if (!name) return toast('اكتب اسم الموقع');
  try { const u = new URL(url); if (!/^https?:$/.test(u.protocol)) throw 0; } catch (e) { return toast('الرابط غير صحيح'); }
  if (sources.some(s => s.url === url)) return toast('هذا المصدر مضاف مسبقاً');
  sources.push({ id: 'c' + Date.now(), name, url, cat });
  closeModal('addModal'); afterSourcesChange(); toast('تمت إضافة المصدر');
}
function removeSource(id) { if (!confirm('حذف هذا المصدر؟')) return; sources = sources.filter(s => s.id !== id); afterSourcesChange(); }
function resetSources() { if (!confirm('استعادة المصادر الافتراضية وحذف ما أضفته؟')) return; sources = DEFAULT_SOURCES.slice(); afterSourcesChange(); }
function clearCache() { ['libya', 'economy', 'world'].forEach(k => { try { localStorage.removeItem('cache_' + k); } catch (e) {} }); toast('تم المسح'); }

/* ===================== السحب للتحديث (تحديث فعلي بدون إعادة تحميل الصفحة) ===================== */
(function () {
  const ptr = $('pull-to-refresh'), txt = $('ptr-text'), icon = ptr.querySelector('svg');
  let startY = 0, pull = 0, pulling = false, busy = false;
  const LIMIT = 60;

  window.addEventListener('touchstart', e => {
    if (busy || window.scrollY > 0 || document.querySelector('.modal-overlay.open')) return;
    startY = e.touches[0].clientY; pull = 0; pulling = true; ptr.style.transition = 'none';
  }, { passive: true });

  window.addEventListener('touchmove', e => {
    if (!pulling) return;
    const d = e.touches[0].clientY - startY;
    if (d > 0 && window.scrollY === 0) {
      pull = Math.min(d * 0.45, 85);
      ptr.style.top = (pull - 65) + 'px';
      icon.style.transform = `rotate(${d * 2}deg)`;
      txt.textContent = pull >= LIMIT ? 'أفلت للتحديث الآن' : 'اسحب لتحديث الأخبار...';
    } else if (d < 0) { pulling = false; ptr.style.transition = 'top .3s ease'; ptr.style.top = '-65px'; }
  }, { passive: true });

  window.addEventListener('touchend', async () => {
    if (!pulling) return;
    pulling = false; ptr.style.transition = 'top .3s ease';
    if (pull >= LIMIT && !busy) {
      busy = true; ptr.style.top = '10px'; icon.style.transform = ''; ptr.classList.add('ptr-loading'); txt.textContent = 'جاري جلب أحدث الأخبار...';
      if (currentTab !== 'settings') await Promise.all([loadTab(currentTab, true), loadRates(true)]);
      else await new Promise(r => setTimeout(r, 500));
      ptr.classList.remove('ptr-loading'); ptr.style.top = '-65px'; txt.textContent = 'اسحب لتحديث الأخبار...'; busy = false;
    } else ptr.style.top = '-65px';
    pull = 0;
  });
})();

loadRates();
loadTab('libya', false);
movePill(activeBtn(), false);
window.addEventListener('resize', () => movePill(activeBtn(), false));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => movePill(activeBtn(), false));
</script>
